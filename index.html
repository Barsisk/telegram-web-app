<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App - Авторизация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 15px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
        }
        
        .btn-secondary:hover {
            background: #e2e8f0;
            box-shadow: 0 10px 20px rgba(148, 163, 184, 0.3);
        }
        
        .form-toggle {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
        }
        
        .form-toggle a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        
        .form-toggle a:hover {
            text-decoration: underline;
        }
        
        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        
        .success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        
        .error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        
        .user-data {
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            border: 1px solid #e2e8f0;
        }
        
        .user-data h3 {
            margin-bottom: 10px;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="form-title">Вход в аккаунт</h1>
        
        <div id="message" class="message"></div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" placeholder="Ваш email" required>
            </div>
            
            <div class="form-group">
                <label for="login-password">Пароль</label>
                <input type="password" id="login-password" placeholder="Ваш пароль" required>
            </div>
            
            <button type="submit" class="btn">Войти</button>
            <button type="button" class="btn btn-secondary" onclick="switchToRegister()">Регистрация</button>
        </form>
        
        <form id="register-form" style="display: none;">
            <div class="form-group">
                <label for="register-name">Имя</label>
                <input type="text" id="register-name" placeholder="Ваше имя" required>
            </div>
            
            <div class="form-group">
                <label for="register-email">Email</label>
                <input type="email" id="register-email" placeholder="Ваш email" required>
            </div>
            
            <div class="form-group">
                <label for="register-password">Пароль</label>
                <input type="password" id="register-password" placeholder="Придумайте пароль" required>
            </div>
            
            <div class="form-group">
                <label for="register-phone">Телефон</label>
                <input type="tel" id="register-phone" placeholder="+7 (900) 123-45-67">
            </div>
            
            <button type="submit" class="btn">Зарегистрироваться</button>
            <button type="button" class="btn btn-secondary" onclick="switchToLogin()">Войти</button>
        </form>
        
        <div id="user-data-display" class="user-data" style="display: none;">
            <h3>Ваши данные:</h3>
            <p id="user-data-content"></p>
        </div>
    </div>

    <script>
        // Получаем Telegram Web App объект
        const tg = window.Telegram.WebApp;
        
        // Инициализируем приложение
        tg.expand();
        tg.ready();
        
        // Элементы DOM
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const formTitle = document.getElementById('form-title');
        const messageDiv = document.getElementById('message');
        const userDataDisplay = document.getElementById('user-data-display');
        const userDataContent = document.getElementById('user-data-content');
        
        // Данные пользователя
        let userData = null;
        
        // Функция для отображения сообщений
        function showMessage(text, type = 'success') {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }
        
        // Функция переключения на форму регистрации
        function switchToRegister() {
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
            formTitle.textContent = 'Регистрация';
            userDataDisplay.style.display = 'none';
        }
        
        // Функция переключения на форму входа
        function switchToLogin() {
            registerForm.style.display = 'none';
            loginForm.style.display = 'block';
            formTitle.textContent = 'Вход в аккаунт';
            userDataDisplay.style.display = 'none';
        }
        
        // Обработчик формы входа
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            // Имитация проверки данных (в реальном приложении здесь был бы запрос на сервер)
            if (email && password) {
                userData = {
                    action: 'login',
                    email: email,
                    timestamp: new Date().toISOString(),
                    telegramId: tg.initDataUnsafe.user?.id,
                    telegramUsername: tg.initDataUnsafe.user?.username,
                    firstName: tg.initDataUnsafe.user?.first_name,
                    lastName: tg.initDataUnsafe.user?.last_name
                };
                
                // Отправляем данные в Telegram бота
                sendDataToBot(userData);
                
                showMessage('✅ Вход выполнен успешно! Данные отправлены в Telegram.');
                
                // Показываем данные пользователя
                displayUserData(userData);
            } else {
                showMessage('❌ Пожалуйста, заполните все поля', 'error');
            }
        });
        
        // Обработчик формы регистрации
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const phone = document.getElementById('register-phone').value;
            
            // Имитация регистрации
            if (name && email && password) {
                userData = {
                    action: 'register',
                    name: name,
                    email: email,
                    phone: phone,
                    timestamp: new Date().toISOString(),
                    telegramId: tg.initDataUnsafe.user?.id,
                    telegramUsername: tg.initDataUnsafe.user?.username,
                    firstName: tg.initDataUnsafe.user?.first_name,
                    lastName: tg.initDataUnsafe.user?.last_name
                };
                
                // Отправляем данные в Telegram бота
                sendDataToBot(userData);
                
                showMessage('✅ Регистрация выполнена успешно! Данные отправлены в Telegram.');
                
                // Показываем данные пользователя
                displayUserData(userData);
                
                // Переключаемся на форму входа после регистрации
                setTimeout(() => {
                    switchToLogin();
                }, 3000);
            } else {
                showMessage('❌ Пожалуйста, заполните обязательные поля', 'error');
            }
        });
        
        // Функция для отправки данных в бота
        function sendDataToBot(data) {
            // Преобразуем данные в строку для отправки
            const dataStr = `WEB_APP_DATA:${JSON.stringify(data, null, 2)}`;
            
            // Отправляем данные через Telegram Web App
            tg.sendData(dataStr);
            
            // Альтернативный способ - через закрытие Web App с передачей данных
            // tg.close();
        }
        
        // Функция для отображения данных пользователя
        function displayUserData(data) {
            const formattedData = `
                Действие: ${data.action}<br>
                ${data.name ? `Имя: ${data.name}<br>` : ''}
                Email: ${data.email}<br>
                ${data.phone ? `Телефон: ${data.phone}<br>` : ''}
                Время: ${new Date(data.timestamp).toLocaleString('ru-RU')}<br>
                Telegram ID: ${data.telegramId || 'Не указан'}<br>
                Username: @${data.telegramUsername || 'Не указан'}
            `;
            
            userDataContent.innerHTML = formattedData;
            userDataDisplay.style.display = 'block';
            
            // Скрываем формы
            loginForm.style.display = 'none';
            registerForm.style.display = 'none';
            formTitle.textContent = 'Данные отправлены!';
        }
        
        // Инициализация - проверяем, если данные уже есть в initData
        if (tg.initDataUnsafe.user) {
            const telegramUser = tg.initDataUnsafe.user;
            console.log('Telegram user data:', telegramUser);
            
            // Можно автоматически заполнить email из данных Telegram
            // document.getElementById('login-email').value = 
            //     telegramUser.username ? `${telegramUser.username}@telegram.com` : '';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
  <title>Тест · Матрицы и графики (ручное указание)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(145deg, #1e3c3a 0%, #0f2a28 100%);
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      width: 100%;
      max-width: 950px;
      background: #f0f7f6;
      border-radius: 2.5rem;
      box-shadow: 0 30px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(200,240,235,0.6);
      padding: 2rem 2rem 1.8rem;
      transition: all 0.2s;
      border: 1px solid rgba(60, 150, 130, 0.5);
    }
    h1 {
      text-align: center;
      color: #0a3a34;
      font-weight: 600;
      font-size: 2.2rem;
      letter-spacing: 2px;
      margin-bottom: 1.5rem;
      text-shadow: 2px 2px 0 rgba(100, 200, 180, 0.3);
      border-bottom: 3px dashed #2e8b7a;
      padding-bottom: 0.5rem;
    }
    .student-area {
      background: #d4ece7;
      border-radius: 2rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 15px;
    }
    .student-area label {
      font-weight: 700;
      color: #0a3a34;
      font-size: 1.1rem;
    }
    #fullNameInput {
      flex: 1 1 250px;
      padding: 0.9rem 1.2rem;
      border: 2px solid #5fa89b;
      border-radius: 3rem;
      font-size: 1rem;
      background: #ffffff;
      outline: none;
      transition: 0.2s;
      font-weight: 500;
    }
    #fullNameInput:focus {
      border-color: #2e6b60;
      box-shadow: 0 0 0 4px rgba(46, 107, 96, 0.25);
    }
    .btn {
      background: #3d8b7a;
      border: none;
      color: #ffffff;
      font-weight: 700;
      padding: 0.8rem 2rem;
      border-radius: 3rem;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      background: linear-gradient(180deg, #58b8a6 0%, #2e6b60 100%);
      box-shadow: 0 6px 0 #1e4a40, 0 8px 16px rgba(0,0,0,0.3);
      border: 1px solid #8fd6c8;
      letter-spacing: 0.8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #1e4a40, 0 12px 20px rgba(0,0,0,0.35);
      background: linear-gradient(180deg, #6ecfbc 0%, #2e6b60 100%);
    }
    .btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #1e4a40, 0 5px 10px rgba(0,0,0,0.3);
    }
    .btn:disabled {
      opacity: 0.6;
      filter: grayscale(0.3);
      transform: translateY(2px);
      box-shadow: 0 3px 0 #1e4a40, 0 5px 10px rgba(0,0,0,0.2);
      cursor: not-allowed;
    }
    .btn-start {
      background: linear-gradient(180deg, #5b8cb8 0%, #2a4b6e 100%);
      box-shadow: 0 6px 0 #1a2e42, 0 8px 16px rgba(0,0,0,0.3);
      border-color: #7faed4;
    }
    .btn-finish {
      background: linear-gradient(180deg, #c97b5b 0%, #8b3c2c 100%);
      box-shadow: 0 6px 0 #572b1c, 0 8px 16px rgba(0,0,0,0.3);
      border-color: #e09d7e;
      color: white;
      width: 100%;
      margin-top: 1.5rem;
      font-size: 1.2rem;
    }
    .test-panel {
      background: #e6f3f0;
      border-radius: 1.8rem;
      padding: 1.5rem;
      margin: 1.2rem 0;
      border: 1px solid #b0d9d0;
    }
    .question-block {
      background: white;
      border-radius: 1.2rem;
      padding: 1.2rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 6px 12px rgba(0,0,0,0.06);
      border-left: 6px solid #2e8b7a;
    }
    .question-text {
      font-weight: 700;
      color: #0a3a34;
      margin-bottom: 0.8rem;
      font-size: 1.1rem;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .option-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: #f0f7f6;
      padding: 0.6rem 1rem;
      border-radius: 1.5rem;
      transition: 0.1s;
      cursor: pointer;
      border: 1px solid #c0ddd6;
    }
    .option-item input[type="radio"] {
      accent-color: #2e6b60;
      width: 1.2rem;
      height: 1.2rem;
      margin-right: 0.3rem;
      cursor: pointer;
    }
    .option-item label {
      cursor: pointer;
      font-weight: 500;
      width: 100%;
      color: #0a3a34;
    }
    .matrix-table {
      border-collapse: collapse;
      margin: 0.3rem 0;
    }
    .matrix-table td {
      border: 1px solid #2e8b7a;
      padding: 0.3rem 0.8rem;
      text-align: center;
      font-weight: 500;
      background: #fff;
    }
    .graph-container {
      margin-top: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      border: 2px solid #2e8b7a;
      border-radius: 12px;
      background: #fff;
      cursor: crosshair;
      width: 100%;
      max-width: 480px;
      height: auto;
    }
    .graph-coords {
      font-size: 0.9rem;
      color: #1e4a40;
      margin-top: 0.3rem;
      text-align: center;
    }
    .results-area {
      background: #1a2e2b;
      border-radius: 2rem;
      padding: 1.5rem;
      color: #d4ece7;
      margin-top: 1rem;
      max-height: 400px;
      overflow-y: auto;
    }
    .result-entry {
      background: #2d4540;
      border-radius: 1rem;
      padding: 0.8rem 1.2rem;
      margin-bottom: 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .hidden {
      display: none !important;
    }
    hr {
      border: 1px solid #8fd6c8;
      margin: 1rem 0;
    }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: #f0f7f6;
      border-radius: 2rem;
      max-width: 800px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 1.8rem;
      box-shadow: 0 30px 50px black;
      border: 2px solid #3d8b7a;
    }
    .modal-content h2 {
      color: #0a3a34;
      margin-bottom: 1rem;
    }
    .review-block {
      background: #fff;
      border-radius: 1rem;
      padding: 1rem;
      margin-bottom: 1rem;
      border-left: 6px solid;
    }
    .correct-border { border-color: #2e7d32; background: #e8f5e8; }
    .wrong-border { border-color: #b71c1c; background: #ffebee; }

      font-weight: 700;
      margin-bottom: 0.4rem;
    }
    .answer-line {
      font-size: 0.95rem;
      margin: 0.2rem 0;
    }
    .close-modal-btn {
      background: #2e6b60;
      border: none;
      color: white;
      padding: 0.7rem 2rem;
      border-radius: 2rem;
      font-weight: bold;
      margin-top: 1rem;
      cursor: pointer;
    }

</head>
<body>
<div class="container">
  <h1>📐 Матрицы и графики</h1>

  <div class="student-area" id="studentPanel">

  <div id="testSection" class="test-panel hidden">
    <div id="questionsContainer"></div>
    <button class="btn" id="submitStudentBtn">✅ Завершить попытку</button>
  </div>

  <button class="btn btn-finish hidden" id="finalFinishBtn">📊 Закончить тестирование (результаты группы)</button>
  <div id="resultsContainer" class="results-area hidden"></div>
</div>

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function prepareRandomVariant() {
      const keys = ['v1','v2','v3','v4'];
      const randomKey = keys[Math.floor(Math.random() * keys.length)];
      const variant = QUESTION_BANK[randomKey];
      return shuffleArray(variant.map(q => {
        if (q.type === 'matrix') {
          const opts = q.options.map(opt => ({...opt}));
          const shuffled = shuffleArray([...opts]);
          const newCorrect = shuffled.findIndex(opt => opt.correct);
          return { ...q, options: shuffled, correctIndex: newCorrect };
        } else {
          return { ...q };
        }
      }));
    }

    function renderMatrixTable(matrix) {
      const table = document.createElement('table');
      table.className = 'matrix-table';
      matrix.forEach(row => {
        const tr = document.createElement('tr');
        row.forEach(val => {
          const td = document.createElement('td');
          td.textContent = val;
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });
      return table;
    }

    function renderGraphQuestion(container, question, qIndex) {
      const canvas = document.createElement('canvas');
      canvas.width = 480;
      canvas.height = 280;
      canvas.style.maxWidth = '100%';
      const ctx = canvas.getContext('2d');

      const xMin = question.xMin, xMax = question.xMax, yMin = question.yMin, yMax = question.yMax;
      const padLeft = 55, padRight = 25, padTop = 25, padBottom = 35;
      const plotWidth = canvas.width - padLeft - padRight;
      const plotHeight = canvas.height - padTop - padBottom;

      function toCanvasX(x) { return padLeft + (x - xMin) / (xMax - xMin) * plotWidth; }
      function toCanvasY(y) { return padTop + (yMax - y) / (yMax - yMin) * plotHeight; }

      function drawGraph() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        // Сетка
        ctx.strokeStyle = '#ddd'; ctx.lineWidth=0.5;
        let yStep = (yMax - yMin) > 5 ? 1 : 0.5;
        for (let y = Math.ceil(yMin/yStep)*yStep; y <= yMax; y+=yStep) {
          ctx.beginPath(); ctx.moveTo(padLeft, toCanvasY(y)); ctx.lineTo(canvas.width-padRight, toCanvasY(y)); ctx.stroke();
        }
        let xStep = (xMax - xMin) > 5 ? 1 : 0.5;
        for (let x = Math.ceil(xMin/xStep)*xStep; x <= xMax; x+=xStep) {
          ctx.beginPath(); ctx.moveTo(toCanvasX(x), padTop); ctx.lineTo(toCanvasX(x), canvas.height-padBottom); ctx.stroke();
        }
        // Оси
        ctx.strokeStyle = '#333'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(padLeft, toCanvasY(0)); ctx.lineTo(canvas.width-padRight, toCanvasY(0)); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(toCanvasX(0), padTop); ctx.lineTo(toCanvasX(0), canvas.height-padBottom); ctx.stroke();
        // Подписи
        ctx.fillStyle = '#333'; ctx.font = '12px sans-serif';
        ctx.fillText('0', toCanvasX(0)-15, toCanvasY(0)-5);
        for (let x = Math.ceil(xMin); x <= xMax; x+=1) {
          if (x === 0) continue;
          ctx.fillText(x, toCanvasX(x)-5, toCanvasY(0)-5);
        }
        for (let y = Math.ceil(yMin); y <= yMax; y+=1) {
          if (y === 0) continue;
          ctx.fillText(y, toCanvasX(0)-25, toCanvasY(y)+4);
        }

        if (studentAnswers[qIndex]) {
          const pt = studentAnswers[qIndex];
          ctx.fillStyle = '#c9302c';
          ctx.beginPath();
          ctx.arc(toCanvasX(pt.x), toCanvasY(pt.y), 6, 0, 2*Math.PI);
          ctx.fill();
          ctx.fillStyle = '#000'; ctx.font='bold 11px sans-serif';
          ctx.fillText(`(${pt.x.toFixed(2)}, ${pt.y.toFixed(2)})`, toCanvasX(pt.x)+8, toCanvasY(pt.y)-8);
        }
      }

      drawGraph();
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mx = (e.clientX - rect.left) * scaleX;
        const my = (e.clientY - rect.top) * scaleY;
        const x = xMin + (mx - padLeft) / plotWidth * (xMax - xMin);
        const y = yMax - (my - padTop) / plotHeight * (yMax - yMin);
        if (x < xMin || x > xMax || y < yMin || y > yMax) return;
        studentAnswers[qIndex] = {x, y};
        drawGraph();
        coordDiv.textContent = `Выбрано: x≈${x.toFixed(3)}, y≈${y.toFixed(3)}`;
      });

      container.appendChild(canvas);
      const coordDiv = document.createElement('div');
      coordDiv.className = 'graph-coords';
      coordDiv.textContent = 'Вычислите координаты и кликните в нужное место';
      container.appendChild(coordDiv);
      if (studentAnswers[qIndex]) {
        coordDiv.textContent = `Выбрано: x≈${studentAnswers[qIndex].x.toFixed(3)}, y≈${studentAnswers[qIndex].y.toFixed(3)}`;
      }
    }

    function renderTest() {
      if (!questionsContainer) return;
      questionsContainer.innerHTML = '';
      studentAnswers = new Array(currentQuestions.length).fill(null);

      currentQuestions.forEach((q, qIdx) => {
        const block = document.createElement('div');
        block.className = 'question-block';
        block.innerHTML = `<div class="question-text">${qIdx+1}. ${q.text}</div>`;

        if (q.type === 'matrix') {
          if (q.matrixA) {
            const matDiv = document.createElement('div');
            matDiv.style.marginBottom = '0.5rem';
            matDiv.appendChild(renderMatrixTable(q.matrixA));
            if (q.matrixB) {
              matDiv.appendChild(document.createTextNode(' × '));
              matDiv.appendChild(renderMatrixTable(q.matrixB));
            }
            block.appendChild(matDiv);
          }
          const optsDiv = document.createElement('div');
          optsDiv.className = 'options';
          q.options.forEach((opt, optIdx) => {
            const item = document.createElement('div');
            item.className = 'option-item';
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = `q${qIdx}`;
            radio.value = optIdx;
            const label = document.createElement('label');
            label.appendChild(renderMatrixTable(opt.matrix));
            item.appendChild(radio);
            item.appendChild(label);
            radio.addEventListener('change', () => { if (testActive) studentAnswers[qIdx] = parseInt(radio.value); });
            optsDiv.appendChild(item);
          });
          block.appendChild(optsDiv);
        } else if (q.type === 'graph') {
          const graphContainer = document.createElement('div');
          graphContainer.className = 'graph-container';
          block.appendChild(graphContainer);
          renderGraphQuestion(graphContainer, q, qIdx);
        }
        questionsContainer.appendChild(block);
      });
    }

    function showReviewModal(questions, answers) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      const modal = document.createElement('div');
      modal.className = 'modal-content';
      let html = `<h2>📋 Разбор ответов: ${currentStudentName}</h2>`;

      questions.forEach((q, idx) => {
        const ans = answers[idx];
        let isCorrect = false;
        let userDisplay = '';
        let correctDisplay = '';

        if (q.type === 'matrix') {
          const userIdx = ans;
          if (userIdx !== null && userIdx !== undefined) {
            userDisplay = '<div style="display:inline-block">'+renderMatrixTable(q.options[userIdx].matrix).outerHTML+'</div>';
          } else {
            userDisplay = '(нет ответа)';
          }
          correctDisplay = '<div style="display:inline-block">'+renderMatrixTable(q.options[q.correctIndex].matrix).outerHTML+'</div>';
          isCorrect = (userIdx === q.correctIndex);
        } else if (q.type === 'graph') {
          if (ans && typeof ans.x === 'number') {
            userDisplay = `(${ans.x.toFixed(3)}, ${ans.y.toFixed(3)})`;
            isCorrect = Math.abs(ans.x - q.correctX) < q.tol && Math.abs(ans.y - q.correctY) < q.tol;
          } else {
            userDisplay = '(точка не выбрана)';
          }
          correctDisplay = `(${q.correctX.toFixed(3)}, ${q.correctY.toFixed(3)})`;
        }

        const borderClass = isCorrect ? 'correct-border' : 'wrong-border';
        const icon = isCorrect ? '✅' : '❌';
        html += `<div class="review-block ${borderClass}">`;
        html += `<div class="review-question">${icon} ${idx+1}. ${q.text}</div>`;
        html += `<div class="answer-line">👤 Ваш ответ: <strong>${userDisplay}</strong></div>`;
        if (!isCorrect) html += `<div class="answer-line">✅ Правильный: <strong>${correctDisplay}</strong></div>`;
        html += `</div>`;
      });

      modal.innerHTML = html;
      const closeBtn = document.createElement('button');
      closeBtn.className = 'close-modal-btn';
      closeBtn.textContent = 'Закрыть';
      closeBtn.addEventListener('click', () => overlay.remove());
      modal.appendChild(closeBtn);
      overlay.appendChild(modal);
      document.body.appendChild(overlay);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    }

    function startTest() {
      const name = fullNameInput.value.trim();
      if (!name) { alert('Введите ФИО'); return; }
      if (allResults.some(r => r.name.toLowerCase() === name.toLowerCase())) {
        alert('Участник с таким ФИО уже проходил тест.'); return;
      }
      currentStudentName = name;
      currentQuestions = prepareRandomVariant();
      studentAnswers = new Array(currentQuestions.length).fill(null);
      testActive = true;
      studentPanel.classList.add('hidden');
      testSection.classList.remove('hidden');
      finalFinishBtn.classList.add('hidden');
      resultsContainer.classList.add('hidden');
      renderTest();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function submitStudentAttempt() {
      if (!testActive || !currentStudentName) return;
      for (let i = 0; i < currentQuestions.length; i++) {
        if (currentQuestions[i].type === 'matrix' && (studentAnswers[i] === null || studentAnswers[i] === undefined)) {
          alert(`Ответьте на вопрос №${i+1}`); return;
        }
        if (currentQuestions[i].type === 'graph' && !studentAnswers[i]) {
          alert(`Выберите точку на графике в вопросе №${i+1}`); return;
        }
      }

      let score = 0;
      for (let i = 0; i < currentQuestions.length; i++) {
        const q = currentQuestions[i];
        if (q.type === 'matrix') {
          if (studentAnswers[i] === q.correctIndex) score++;
        } else if (q.type === 'graph') {
          const ans = studentAnswers[i];
          if (Math.abs(ans.x - q.correctX) < q.tol && Math.abs(ans.y - q.correctY) < q.tol) score++;
        }
      }

      showReviewModal(currentQuestions, studentAnswers);
      allResults.push({ name: currentStudentName, score, total: currentQuestions.length });

      testActive = false;
      currentQuestions = [];
      studentAnswers = [];
      currentStudentName = "";

      testSection.classList.add('hidden');
      studentPanel.classList.remove('hidden');
      fullNameInput.value = '';
      if (allResults.length > 0) finalFinishBtn.classList.remove('hidden');
    }

    function showFinalResults() {
      if (!allResults.length) { alert('Нет результатов'); return; }
      resultsContainer.classList.remove('hidden');
      resultsContainer.innerHTML = '<h3 style="margin-bottom:1rem; color:#d4ece7;">🏆 Итоги группы</h3>';
      [...allResults].sort((a,b)=>a.name.localeCompare(b.name)).forEach((res, i) => {
        const div = document.createElement('div');
        div.className = 'result-entry';
        div.innerHTML = `<span><strong>${i+1}. ${res.name}</strong></span><span>✅ ${res.score}/${res.total}</span>`;
        resultsContainer.appendChild(div);
      });
      finalFinishBtn.classList.add('hidden');
      testSection.classList.add('hidden');
      studentPanel.classList.add('hidden');
    }

    startBtn.addEventListener('click', startTest);
    submitStudentBtn.addEventListener('click', submitStudentAttempt);
    finalFinishBtn.addEventListener('click', showFinalResults);
    fullNameInput.addEventListener('keypress', e => { if (e.key==='Enter') { e.preventDefault(); startTest(); } });
    window.addEventListener('load', () => {
      testSection.classList.add('hidden');
      finalFinishBtn.classList.add('hidden');
      resultsContainer.classList.add('hidden');
    });
  })();
</script>
</body>
</html>

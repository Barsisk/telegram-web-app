<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App - Уведомление</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .description {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        
        .notification-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 15px;
            padding: 18px 30px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .notification-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }
        
        .notification-btn:active {
            transform: translateY(-1px);
        }
        
        .notification-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            font-weight: 500;
        }
        
        .success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
            display: block;
        }
        
        .error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
            display: block;
        }
        
        .counter {
            font-size: 14px;
            color: #888;
            margin-top: 10px;
        }
        
        .user-info {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: left;
            border: 1px solid #e2e8f0;
        }
        
        .user-info h3 {
            margin-bottom: 10px;
            color: #475569;
            font-size: 16px;
        }
        
        .icon {
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📨 Уведомление администратору</h1>
        
        <div class="description">
            Нажмите кнопку ниже, чтобы отправить уведомление администратору.
            Вы получите подтверждение в Telegram.
        </div>
        
        <div class="user-info" id="user-info">
            <h3>Ваши данные Telegram:</h3>
            <div id="telegram-data">Загрузка...</div>
        </div>
        
        <button class="notification-btn" id="notify-btn" onclick="sendNotification()">
            <span class="icon">🔔</span>
            Отправить уведомление администратору
        </button>
        
        <div class="counter">
            Отправлено: <span id="counter">0</span> раз
        </div>
        
        <div class="status" id="status"></div>
    </div>

    <script>
        // Telegram Web App объект
        const tg = window.Telegram.WebApp;
        
        // Инициализация
        tg.expand();
        tg.ready();
        
        // Элементы DOM
        const notifyBtn = document.getElementById('notify-btn');
        const statusDiv = document.getElementById('status');
        const counterSpan = document.getElementById('counter');
        const telegramDataDiv = document.getElementById('telegram-data');
        const userInfoDiv = document.getElementById('user-info');
        
        // Счетчик нажатий
        let clickCount = 0;
        
        // Функция для отображения статуса
        function showStatus(message, type = 'success') {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            
            setTimeout(() => {
                statusDiv.style.display = 'none';
                statusDiv.className = 'status';
            }, 5000);
        }
        
        // Функция отправки уведомления
        function sendNotification() {
            // Получаем данные Telegram пользователя
            const tgUser = tg.initDataUnsafe.user || {};
            
            // Создаем сообщение с текущим временем
            const now = new Date();
            const timeString = now.toLocaleTimeString('ru-RU');
            const dateString = now.toLocaleDateString('ru-RU');
            
            // Формируем данные для отправки
            const notificationData = {
                message: `Уведомление от пользователя ${tgUser.first_name || 'Неизвестный'}! ${timeString} ${dateString}`,
                action: "notification",
                timestamp: now.toISOString(),
                user_telegram_id: tgUser.id,
                click_number: clickCount + 1
            };
            
            // Блокируем кнопку на время отправки
            notifyBtn.disabled = true;
            notifyBtn.innerHTML = '<span class="icon">⏳</span> Отправка...';
            
            // Отправляем данные в бота
            tg.sendData(`NOTIFY_ADMIN:${JSON.stringify(notificationData)}`);
            
            // Обновляем счетчик
            clickCount++;
            counterSpan.textContent = clickCount;
            
            // Показываем статус
            showStatus('✅ Уведомление отправлено! Закройте мини-приложение.', 'success');
            
            // Разблокируем кнопку через 2 секунды
            setTimeout(() => {
                notifyBtn.disabled = false;
                notifyBtn.innerHTML = '<span class="icon">🔔</span> Отправить еще одно уведомление';
            }, 2000);
        }
        
        // Показываем данные Telegram пользователя при загрузке
        function displayTelegramData() {
            const tgUser = tg.initDataUnsafe.user;
            
            if (tgUser) {
                let userInfo = '';
                
                if (tgUser.first_name) {
                    userInfo += `<strong>Имя:</strong> ${tgUser.first_name}<br>`;
                }
                if (tgUser.last_name) {
                    userInfo += `<strong>Фамилия:</strong> ${tgUser.last_name}<br>`;
                }
                if (tgUser.username) {
                    userInfo += `<strong>Username:</strong> @${tgUser.username}<br>`;
                }
                if (tgUser.id) {
                    userInfo += `<strong>Telegram ID:</strong> ${tgUser.id}`;
                }
                
                telegramDataDiv.innerHTML = userInfo;
            } else {
                userInfoDiv.style.display = 'none';
            }
        }
        
        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            displayTelegramData();
            
            // Показываем версию Web App (для отладки)
            console.log('Telegram Web App version:', tg.version);
            console.log('Telegram user data:', tg.initDataUnsafe.user);
            
            // Можно добавить автоматическую отправку при открытии (если нужно)
            // setTimeout(sendNotification, 1000);
        });
        
        // Обработчик закрытия Web App
        tg.onEvent('viewportChanged', function() {
            console.log('Viewport changed');
        });
        
        // Пример: автоматическая отправка при определенных условиях
        // if (tg.initDataUnsafe.start_param === 'auto_notify') {
        //     setTimeout(sendNotification, 1000);
        // }
    </script>
</body>
</html>

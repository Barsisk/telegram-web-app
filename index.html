<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
  <title>Зачет · Тригонометрия</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(145deg, #2c1e4a 0%, #1a1230 100%);
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      width: 100%;
      max-width: 900px;
      background: #f5f0ff;
      border-radius: 2.5rem;
      box-shadow: 0 30px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(220,200,255,0.6);
      padding: 2rem 2rem 1.8rem;
      transition: all 0.2s;
      border: 1px solid rgba(150, 120, 220, 0.5);
    }
    h1 {
      text-align: center;
      color: #2e1a4e;
      font-weight: 600;
      font-size: 2.2rem;
      letter-spacing: 2px;
      margin-bottom: 1.5rem;
      text-shadow: 2px 2px 0 rgba(180, 150, 220, 0.4);
      border-bottom: 3px dashed #7b5ea7;
      padding-bottom: 0.5rem;
    }
    .student-area {
      background: #e4d9f5;
      border-radius: 2rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 15px;
    }
    .student-area label {
      font-weight: 700;
      color: #2e1a4e;
      font-size: 1.1rem;
    }
    #fullNameInput {
      flex: 1 1 250px;
      padding: 0.9rem 1.2rem;
      border: 2px solid #9b7ec4;
      border-radius: 3rem;
      font-size: 1rem;
      background: #ffffff;
      outline: none;
      transition: 0.2s;
      font-weight: 500;
    }
    #fullNameInput:focus {
      border-color: #5a3e85;
      box-shadow: 0 0 0 4px rgba(90, 62, 133, 0.25);
    }
    .btn {
      background: #6d4f9e;
      border: none;
      color: #ffffff;
      font-weight: 700;
      padding: 0.8rem 2rem;
      border-radius: 3rem;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      background: linear-gradient(180deg, #8b6bc0 0%, #5a3e85 100%);
      box-shadow: 0 6px 0 #3d295c, 0 8px 16px rgba(0,0,0,0.3);
      border: 1px solid #b199d4;
      letter-spacing: 0.8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #3d295c, 0 12px 20px rgba(0,0,0,0.35);
      background: linear-gradient(180deg, #9f7ed4 0%, #5a3e85 100%);
    }
    .btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #3d295c, 0 5px 10px rgba(0,0,0,0.3);
    }
    .btn:disabled {
      opacity: 0.6;
      filter: grayscale(0.3);
      transform: translateY(2px);
      box-shadow: 0 3px 0 #3d295c, 0 5px 10px rgba(0,0,0,0.2);
      cursor: not-allowed;
    }
    .btn-start {
      background: linear-gradient(180deg, #5b8cb8 0%, #2a4b6e 100%);
      box-shadow: 0 6px 0 #1a2e42, 0 8px 16px rgba(0,0,0,0.3);
      border-color: #7faed4;
    }
    .btn-finish {
      background: linear-gradient(180deg, #c97b5b 0%, #8b3c2c 100%);
      box-shadow: 0 6px 0 #572b1c, 0 8px 16px rgba(0,0,0,0.3);
      border-color: #e09d7e;
      color: white;
      width: 100%;
      margin-top: 1.5rem;
      font-size: 1.2rem;
    }
    .test-panel {
      background: #f2ecfa;
      border-radius: 1.8rem;
      padding: 1.5rem;
      margin: 1.2rem 0;
      border: 1px solid #c9b3e6;
    }
    .question-block {
      background: white;
      border-radius: 1.2rem;
      padding: 1.2rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 6px 12px rgba(0,0,0,0.06);
      border-left: 6px solid #6d4f9e;
    }
    .question-text {
      font-weight: 700;
      color: #2e1a4e;
      margin-bottom: 0.8rem;
      font-size: 1.1rem;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .option-item {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      background: #f5f0ff;
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      transition: 0.1s;
      cursor: pointer;
      border: 1px solid #d9c9f0;
    }
    .option-item input[type="radio"] {
      accent-color: #5a3e85;
      width: 1.2rem;
      height: 1.2rem;
      margin-right: 0.3rem;
      cursor: pointer;
    }
    .option-item label {
      cursor: pointer;
      font-weight: 500;
      width: 100%;
      color: #2e1a4e;
    }
    .circle-canvas {
      border: 2px solid #6d4f9e;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      display: block;
      margin: 0.5rem auto;
    }
    .select-match {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      margin: 0.3rem 0;
    }
    .select-match select {
      padding: 0.4rem 1rem;
      border-radius: 2rem;
      border: 1px solid #9b7ec4;
      background: white;
      font-weight: 500;
    }
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      cursor: pointer;
    }
    .results-area {
      background: #2a1f3d;
      border-radius: 2rem;
      padding: 1.5rem;
      color: #e4d9f5;
      margin-top: 1rem;
      max-height: 400px;
      overflow-y: auto;
    }
    .result-entry {
      background: #3e2f55;
      border-radius: 1rem;
      padding: 0.8rem 1.2rem;
      margin-bottom: 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .hidden {
      display: none !important;
    }
    hr {
      border: 1px solid #b199d4;
      margin: 1rem 0;
    }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: #f5f0ff;
      border-radius: 2rem;
      max-width: 750px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 1.8rem;
      box-shadow: 0 30px 50px black;
      border: 2px solid #7b5ea7;
    }
    .modal-content h2 {
      color: #2e1a4e;
      margin-bottom: 1rem;
    }
    .review-block {
      background: #fff;
      border-radius: 1rem;
      padding: 1rem;
      margin-bottom: 1rem;
      border-left: 6px solid;
    }
    .correct-border { border-color: #2e7d32; background: #e8f5e8; }
    .wrong-border { border-color: #b71c1c; background: #ffebee; }
    .review-question {
      font-weight: 700;
      margin-bottom: 0.4rem;
    }
    .answer-line {
      font-size: 0.95rem;
      margin: 0.2rem 0;
    }
    .close-modal-btn {
      background: #5a3e85;
      border: none;
      color: white;
      padding: 0.7rem 2rem;
      border-radius: 2rem;
      font-weight: bold;
      margin-top: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>📐 Зачет по Тригонометрии)</h1>

  <div class="student-area" id="studentPanel">
    <label for="fullNameInput">👤 ФИО:</label>
    <input type="text" id="fullNameInput" placeholder="Иванов Иван Иванович" autocomplete="off">
    <button class="btn btn-start" id="startBtn">🚀 Начать тест</button>
  </div>

  <div id="testSection" class="test-panel hidden">
    <div id="questionsContainer"></div>
    <button class="btn" id="submitStudentBtn">✅ Завершить попытку</button>
  </div>

  <button class="btn btn-finish hidden" id="finalFinishBtn">📊 Закончить тестирование (результаты группы)</button>
  <div id="resultsContainer" class="results-area hidden"></div>
</div>

<script>
  (function() {
    // ---------- ЕДИНСТВЕННЫЙ ВАРИАНТ ----------
    const questions = [
      // А1
      { type: 'choice', text: "А1. Градусная мера угла 7π/6 рад равна…", options: ["150°", "330°", "210°", "420°"], correct: 2 },
      // А2 – окружность с выбором точки
      { type: 'circle', text: "А2. Точка тригонометрической окружности с абсциссой -1 соответствует числу…", correctPoint: 'B', points: {
        A: { angle: Math.PI/2, label: 'π/2' },
        B: { angle: Math.PI, label: 'π' },
        C: { angle: 3*Math.PI/2, label: '3π/2' },
        D: { angle: 0, label: '0 (2π)' }
      }},
      // А3 – окружность с точками N,M,P,C
      { type: 'circlePoints', text: "А3. Какая из точек, расположенных на тригонометрической окружности, может соответствовать числу 7π/6?", correctPoint: 'N', points: {
        N: { angle: 7*Math.PI/6, label: 'N' },
        M: { angle: 5*Math.PI/4, label: 'M' },
        P: { angle: 4*Math.PI/3, label: 'P' },
        C: { angle: 5*Math.PI/6, label: 'C' }
      }},
      // А4
      { type: 'choice', text: "А4. Углом какой четверти является угол, равный 560°?", options: ["I", "II", "III", "IV"], correct: 2 },
      // А5 – множественный выбор (чекбоксы)
      { type: 'checkbox', text: "А5. Число -2 может быть значением:", options: ["синуса некоторого угла", "косинуса некоторого угла", "тангенса некоторого угла", "котангенса некоторого угла"], correct: [2,3] },
      // А6 – соответствие (select)
      { type: 'match', text: "А6. Установите соответствие: sinα > 0, cosα > 0. Выберите четверть:", pairs: [{ label: "sinα>0, cosα>0", correct: "I" }], options: ["I", "II", "III", "IV"] },
      // А7
      { type: 'choice', text: "А7. Положительным числом является:", options: ["sin 193°", "cos 293°", "tg 293°", "ctg 293°"], correct: 1 },
      // А8 – множественное соответствие
      { type: 'matchMulti', text: "А8. Установите соответствие между выражениями и их значениями:", pairs: [
        { expr: "а) sin 90°", correct: "1" },
        { expr: "б) cos 90°", correct: "0" },
        { expr: "в) tg 135°", correct: "-1" },
        { expr: "г) tg 45°", correct: "1" }
      ], values: ["1", "0", "-1", "0.5"] },
      // А9
      { type: 'choice', text: "А9. Значение выражения 2sin30° + 2cos60° + tg60° - ctg30° равно:", options: ["1", "3", "0", "2"], correct: 3 },
      // А10
      { type: 'choice', text: "А10. Вычислите cos(π/3).", options: ["1/2", "√2/2", "√3/2", "1"], correct: 0 },
      // В1
      { type: 'numeric', text: "В1. Найдите cosα, если sinα = 0.7 и 0 < α < π/2.", correct: 0.714, tolerance: 0.01 },
      // В2
      { type: 'numeric', text: "В2. Найдите значение выражения: 21·tg(π/4)·sin(π/2).", correct: 21, tolerance: 0.01 },
      // В3
      { type: 'numeric', text: "В3. Найдите значение выражения: 14·sin(-675°).", correct: 14, tolerance: 0.01 },
      // В4
      { type: 'numeric', text: "В4. Найдите значение выражения: 8·cos(π/3)·sin(π/6).", correct: -4, tolerance: 0.01 },
      // В5
      { type: 'numeric', text: "В5. Найдите значение выражения: (sin²45° + cos²45°)·18.", correct: 18, tolerance: 0.01 },
      // В6
      { type: 'numeric', text: "В6. Найдите значение выражения: 14·(sin²30° + cos²30°).", correct: 14, tolerance: 0.01 }
    ];

    let currentStudentName = "";
    let studentAnswers = new Array(questions.length).fill(null);
    let testActive = false;
    let allResults = [];

    const fullNameInput = document.getElementById('fullNameInput');
    const startBtn = document.getElementById('startBtn');
    const testSection = document.getElementById('testSection');
    const questionsContainer = document.getElementById('questionsContainer');
    const submitStudentBtn = document.getElementById('submitStudentBtn');
    const finalFinishBtn = document.getElementById('finalFinishBtn');
    const resultsContainer = document.getElementById('resultsContainer');
    const studentPanel = document.getElementById('studentPanel');

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function drawCircleCanvas(container, question, qIndex, pointLabels) {
      const canvas = document.createElement('canvas');
      canvas.width = 250;
      canvas.height = 250;
      canvas.className = 'circle-canvas';
      const ctx = canvas.getContext('2d');
      const cx = 125, cy = 125, r = 90;
      let selectedPoint = studentAnswers[qIndex];

      function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        // окружность
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, 2*Math.PI);
        ctx.strokeStyle = '#6d4f9e';
        ctx.lineWidth = 2;
        ctx.stroke();
        // оси
        ctx.beginPath();
        ctx.moveTo(cx-r-10, cy); ctx.lineTo(cx+r+10, cy);
        ctx.moveTo(cx, cy-r-10); ctx.lineTo(cx, cy+r+10);
        ctx.strokeStyle = '#999';
        ctx.stroke();
        // точки
        for (let key in pointLabels) {
          let angle = pointLabels[key].angle;
          let px = cx + r * Math.cos(angle);
          let py = cy - r * Math.sin(angle);
          ctx.beginPath();
          ctx.arc(px, py, 5, 0, 2*Math.PI);
          ctx.fillStyle = (selectedPoint === key) ? '#c9302c' : '#5a3e85';
          ctx.fill();
          ctx.fillStyle = '#000';
          ctx.font = 'bold 12px sans-serif';
          ctx.fillText(pointLabels[key].label, px+7, py-7);
        }
      }

      draw();
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mx = (e.clientX - rect.left) * scaleX;
        const my = (e.clientY - rect.top) * scaleY;
        let minDist = 20; // радиус захвата
        let found = null;
        for (let key in pointLabels) {
          let angle = pointLabels[key].angle;
          let px = cx + r * Math.cos(angle);
          let py = cy - r * Math.sin(angle);
          let dist = Math.hypot(mx - px, my - py);
          if (dist < minDist) {
            found = key;
            minDist = dist;
          }
        }
        if (found) {
          studentAnswers[qIndex] = found;
          selectedPoint = found;
          draw();
          coordDiv.textContent = `Выбрана точка: ${found}`;
        }
      });

      container.appendChild(canvas);
      const coordDiv = document.createElement('div');
      coordDiv.style.textAlign = 'center';
      coordDiv.textContent = selectedPoint ? `Выбрана точка: ${selectedPoint}` : 'Кликните по точке на окружности';
      container.appendChild(coordDiv);
    }

    function renderTest() {
      if (!questionsContainer) return;
      questionsContainer.innerHTML = '';
      studentAnswers = new Array(questions.length).fill(null);

      questions.forEach((q, qIdx) => {
        const block = document.createElement('div');
        block.className = 'question-block';
        block.innerHTML = `<div class="question-text">${q.text}</div>`;

        if (q.type === 'choice') {
          const optsDiv = document.createElement('div');
          optsDiv.className = 'options';
          q.options.forEach((opt, optIdx) => {
            const item = document.createElement('div');
            item.className = 'option-item';
            item.innerHTML = `<input type="radio" name="q${qIdx}" value="${optIdx}"><label>${opt}</label>`;
            item.querySelector('input').addEventListener('change', function() {
              if (testActive) studentAnswers[qIdx] = parseInt(this.value);
            });
            optsDiv.appendChild(item);
          });
          block.appendChild(optsDiv);
        } else if (q.type === 'circle') {
          const container = document.createElement('div');
          container.style.textAlign = 'center';
          block.appendChild(container);
          drawCircleCanvas(container, q, qIdx, q.points);
        } else if (q.type === 'circlePoints') {
          const container = document.createElement('div');
          container.style.textAlign = 'center';
          block.appendChild(container);
          drawCircleCanvas(container, q, qIdx, q.points);
        } else if (q.type === 'checkbox') {
          const div = document.createElement('div');
          div.className = 'checkbox-group';
          q.options.forEach((opt, optIdx) => {
            const label = document.createElement('label');
            label.innerHTML = `<input type="checkbox" name="q${qIdx}" value="${optIdx}"> ${opt}`;
            div.appendChild(label);
          });
          block.appendChild(div);
          // обработчик сохраняет массив выбранных индексов
          const checkboxes = div.querySelectorAll('input');
          checkboxes.forEach(cb => {
            cb.addEventListener('change', () => {
              const selected = Array.from(checkboxes).filter(c => c.checked).map(c => parseInt(c.value));
              studentAnswers[qIdx] = selected;
            });
          });
        } else if (q.type === 'match') {
          const div = document.createElement('div');
          div.className = 'select-match';
          q.pairs.forEach(pair => {
            const span = document.createElement('span');
            span.textContent = pair.label + ' → ';
            const select = document.createElement('select');
            select.innerHTML = q.options.map(opt => `<option value="${opt}">${opt}</option>`).join('');
            select.addEventListener('change', () => {
              studentAnswers[qIdx] = select.value;
            });
            div.appendChild(span);
            div.appendChild(select);
          });
          block.appendChild(div);
        } else if (q.type === 'matchMulti') {
          const div = document.createElement('div');
          q.pairs.forEach((pair, i) => {
            const row = document.createElement('div');
            row.className = 'select-match';
            row.innerHTML = `<span>${pair.expr} → </span>`;
            const select = document.createElement('select');
            select.innerHTML = q.values.map(v => `<option value="${v}">${v}</option>`).join('');
            select.addEventListener('change', () => {
              if (!studentAnswers[qIdx]) studentAnswers[qIdx] = {};
              studentAnswers[qIdx][i] = select.value;
            });
            row.appendChild(select);
            div.appendChild(row);
          });
          block.appendChild(div);
        } else if (q.type === 'numeric') {
          const input = document.createElement('input');
          input.type = 'number';
          input.step = 'any';
          input.style.padding = '0.5rem';
          input.style.borderRadius = '1rem';
          input.style.border = '1px solid #9b7ec4';
          input.style.width = '150px';
          input.addEventListener('input', () => {
            studentAnswers[qIdx] = parseFloat(input.value);
          });
          block.appendChild(input);
        }
        questionsContainer.appendChild(block);
      });
    }

    function showReviewModal(answers) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      const modal = document.createElement('div');
      modal.className = 'modal-content';
      let html = `<h2>📋 Разбор ответов: ${currentStudentName}</h2>`;

      questions.forEach((q, idx) => {
        let isCorrect = false;
        let userDisplay = '';
        let correctDisplay = '';
        const ans = answers[idx];

        if (q.type === 'choice') {
          const userIdx = ans;
          userDisplay = (userIdx !== null && userIdx !== undefined) ? q.options[userIdx] : '(нет ответа)';
          correctDisplay = q.options[q.correct];
          isCorrect = (userIdx === q.correct);
        } else if (q.type === 'circle' || q.type === 'circlePoints') {
          userDisplay = ans || '(не выбрано)';
          correctDisplay = q.correctPoint;
          isCorrect = (ans === q.correctPoint);
        } else if (q.type === 'checkbox') {
          const selected = ans || [];
          userDisplay = selected.length ? selected.map(i => q.options[i]).join(', ') : '(нет)';
          correctDisplay = q.correct.map(i => q.options[i]).join(', ');
          isCorrect = selected.length === q.correct.length && selected.every(v => q.correct.includes(v));
        } else if (q.type === 'match') {
          userDisplay = ans || '(не выбрано)';
          correctDisplay = q.pairs[0].correct;
          isCorrect = (ans === correctDisplay);
        } else if (q.type === 'matchMulti') {
          const userObj = ans || {};
          let userStr = '', correctStr = '';
          q.pairs.forEach((p, i) => {
            const u = userObj[i] || '?';
            const c = p.correct;
            userStr += `${p.expr}: ${u}; `;
            correctStr += `${p.expr}: ${c}; `;
          });
          userDisplay = userStr;
          correctDisplay = correctStr;
          isCorrect = q.pairs.every((p, i) => userObj[i] === p.correct);
        } else if (q.type === 'numeric') {
          userDisplay = (ans !== null && !isNaN(ans)) ? ans.toString() : '(нет ответа)';
          correctDisplay = q.correct.toString();
          isCorrect = (Math.abs(ans - q.correct) < (q.tolerance || 0.01));
        }

        const borderClass = isCorrect ? 'correct-border' : 'wrong-border';
        const icon = isCorrect ? '✅' : '❌';
        html += `<div class="review-block ${borderClass}">`;
        html += `<div class="review-question">${icon} ${q.text}</div>`;
        html += `<div class="answer-line">👤 Ваш ответ: <strong>${userDisplay}</strong></div>`;
        if (!isCorrect) html += `<div class="answer-line">✅ Правильный: <strong>${correctDisplay}</strong></div>`;
        html += `</div>`;
      });

      modal.innerHTML = html;
      const closeBtn = document.createElement('button');
      closeBtn.className = 'close-modal-btn';
      closeBtn.textContent = 'Закрыть';
      closeBtn.addEventListener('click', () => overlay.remove());
      modal.appendChild(closeBtn);
      overlay.appendChild(modal);
      document.body.appendChild(overlay);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    }

    function startTest() {
      const name = fullNameInput.value.trim();
      if (!name) { alert('Введите ФИО'); return; }
      if (allResults.some(r => r.name.toLowerCase() === name.toLowerCase())) {
        alert('Участник с таким ФИО уже проходил тест.'); return;
      }
      currentStudentName = name;
      studentAnswers = new Array(questions.length).fill(null);
      testActive = true;
      studentPanel.classList.add('hidden');
      testSection.classList.remove('hidden');
      finalFinishBtn.classList.add('hidden');
      resultsContainer.classList.add('hidden');
      renderTest();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function submitStudentAttempt() {
      if (!testActive || !currentStudentName) return;
      // Проверка заполнения
      for (let i = 0; i < questions.length; i++) {
        const q = questions[i];
        const ans = studentAnswers[i];
        if (q.type === 'choice' && (ans === null || ans === undefined)) { alert(`Ответьте на вопрос А${i+1}`); return; }
        if ((q.type === 'circle' || q.type === 'circlePoints') && !ans) { alert(`Выберите точку в вопросе А${i+1}`); return; }
        if (q.type === 'checkbox' && (!ans || ans.length === 0)) { alert(`Выберите хотя бы один вариант в А${i+1}`); return; }
        if (q.type === 'match' && !ans) { alert(`Выберите значение в А${i+1}`); return; }
        if (q.type === 'matchMulti') {
          const obj = ans || {};
          if (Object.keys(obj).length < q.pairs.length) { alert(`Заполните все соответствия в А${i+1}`); return; }
        }
        if (q.type === 'numeric' && (ans === null || isNaN(ans))) { alert(`Введите число в В${i-9}`); return; }
      }

      let score = 0;
      for (let i = 0; i < questions.length; i++) {
        const q = questions[i];
        const ans = studentAnswers[i];
        if (q.type === 'choice' && ans === q.correct) score++;
        else if ((q.type === 'circle' || q.type === 'circlePoints') && ans === q.correctPoint) score++;
        else if (q.type === 'checkbox') {
          if (ans.length === q.correct.length && ans.every(v => q.correct.includes(v))) score++;
        } else if (q.type === 'match' && ans === q.pairs[0].correct) score++;
        else if (q.type === 'matchMulti') {
          if (q.pairs.every((p, i) => ans[i] === p.correct)) score++;
        } else if (q.type === 'numeric' && Math.abs(ans - q.correct) < (q.tolerance || 0.01)) score++;
      }

      showReviewModal(studentAnswers);
      allResults.push({ name: currentStudentName, score, total: questions.length });

      testActive = false;
      studentAnswers = [];
      currentStudentName = "";

      testSection.classList.add('hidden');
      studentPanel.classList.remove('hidden');
      fullNameInput.value = '';
      if (allResults.length > 0) finalFinishBtn.classList.remove('hidden');
    }

    function showFinalResults() {
      if (!allResults.length) { alert('Нет результатов'); return; }
      resultsContainer.classList.remove('hidden');
      resultsContainer.innerHTML = '<h3 style="margin-bottom:1rem; color:#e4d9f5;">🏆 Итоги группы</h3>';
      [...allResults].sort((a,b)=>a.name.localeCompare(b.name)).forEach((res, i) => {
        const div = document.createElement('div');
        div.className = 'result-entry';
        div.innerHTML = `<span><strong>${i+1}. ${res.name}</strong></span><span>✅ ${res.score}/${res.total}</span>`;
        resultsContainer.appendChild(div);
      });
      finalFinishBtn.classList.add('hidden');
      testSection.classList.add('hidden');
      studentPanel.classList.add('hidden');
    }

    startBtn.addEventListener('click', startTest);
    submitStudentBtn.addEventListener('click', submitStudentAttempt);
    finalFinishBtn.addEventListener('click', showFinalResults);
    fullNameInput.addEventListener('keypress', e => { if (e.key==='Enter') { e.preventDefault(); startTest(); } });
    window.addEventListener('load', () => {
      testSection.classList.add('hidden');
      finalFinishBtn.classList.add('hidden');
      resultsContainer.classList.add('hidden');
    });
  })();
</script>
</body>
</html>
